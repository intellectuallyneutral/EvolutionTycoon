name: EvolutionTycoon Continuous Integration

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  issues: write

jobs:
  verify-style-and-lint:
    name: StyLua and Selene Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Initialize Rokit Toolchain
        uses: roblox-ts/setup-rokit@v0.1.2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Rokit Tools
        run: rokit install --no-trust-check

      - name: Download Dependencies
        run: wally install

      - name: Generate Sourcemap
        run: rojo sourcemap default.project.json -o sourcemap.json

      - name: Execute StyLua Formatting Check
        run: stylua --check src/

      - name: Execute Selene Linting
        run: selene src/

  headless-testing:
    name: Lune Headless Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Initialize Rokit Toolchain
        uses: roblox-ts/setup-rokit@v0.1.2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Rokit Tools
        run: rokit install --no-trust-check

      - name: Download Dependencies
        run: wally install

      - name: Generate Sourcemap
        run: rojo sourcemap default.project.json -o sourcemap.json

      - name: Compile Test Place
        run: rojo build -o EvolutionTest.rbxl

      - name: Execute Luau Test Suite
        run: |
          lune run lune/run_tests.luau > test.log 2>&1
          
      - name: Report Failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create --title "CI Failure Log" --body "\`\`\`text
          $(cat test.log)
          \`\`\`"
